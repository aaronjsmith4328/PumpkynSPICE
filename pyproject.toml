[project]
name = "pumpkynspice"
version = "0.1.0"
description = "A tiny, from-scratch circuit simulator for learning, tinkering, and benchmarking pure Python vs. NumPy."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "pyspice>=1.5",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pudb>=2025.1.5",
]

[project.scripts]
psl = "Spice:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Spice.py"]
